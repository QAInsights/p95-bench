id: mx-r06-threshold-tags-locust
category: repair
tool: locust
grader: v2_exec
prompt: 'Fix a checkout latency threshold whose request name is accidentally attached
  to fast health requests.


  Repair the supplied artifact.


  Execution contract: {"users": 2, "iterations": 2, "mode": "threshold"}. Non-workload
  counts are iterations per user. One committed order per journey, no duplicate/extra
  carts. Two fixture variants count equally; the same artifact is reused without feedback.
  Fresh owner seeds are recorded after execution. Profiles: [{"checkout_delay_seconds":
  0.01}, {"checkout_delay_seconds": 0.01, "html_layout": 1, "reverse_catalog": true,
  "catalog_delay_seconds": 0.5}]. Negative-control overrides: [{"checkout_delay_seconds":
  0.5}].

  Rubric/gates (per case: earned fraction capped by every prerequisite fraction; average
  all cases, never best case):

  loads: 10 points — script loads Requires: none.

  setup: 25 points — tags real checkout requests correctly Requires: loads.

  behavior: 40 points — checkout-only metric/threshold responds to the injected slowdown
  Requires: loads, setup.

  safety: 25 points — healthy control passes and slow control fails with the expected
  threshold evidence. Requires: loads, behavior.

  Malformed/non-executable artifacts earn zero execution-gated credit. A prerequisite
  fault can lose multiple checkpoints.


  Tag/name POST /v2/orders requests as "checkout" with a 250ms latency threshold/assertion.
  When the checkout latency threshold is breached, call response.failure(...) and
  set self.environment.process_exit_code = 99.'
params:
  tool: locust
  contract:
    users: 2
    iterations: 2
    mode: threshold
  rubric:
  - id: loads
    points: 10
    description: script loads
    requires: []
  - id: setup
    points: 25
    description: tags real checkout requests correctly
    requires:
    - loads
  - id: behavior
    points: 40
    description: checkout-only metric/threshold responds to the injected slowdown
    requires:
    - loads
    - setup
  - id: safety
    points: 25
    description: healthy control passes and slow control fails with the expected threshold
      evidence.
    requires:
    - loads
    - behavior
  trials:
  - name: baseline
    profile:
      checkout_delay_seconds: 0.01
  - name: reordered
    profile:
      checkout_delay_seconds: 0.01
      html_layout: 1
      reverse_catalog: true
      catalog_delay_seconds: 0.5
  controls:
  - checkout_delay_seconds: 0.5
  fixture_aliases: {}
fixtures:
- protocol-locust.md
- broken-r06.py
scenario: mx-r06-threshold-tags
