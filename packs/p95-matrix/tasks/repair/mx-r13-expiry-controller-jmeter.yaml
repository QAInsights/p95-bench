params:
  tool: jmeter
  contract:
    users: 2
    iterations: 3
    mode: expiry
  rubric:
  - id: loads
    points: 10
    description: plan loads
    requires: []
  - id: setup
    points: 25
    description: detects the configured expiry
    requires:
    - loads
  - id: behavior
    points: 40
    description: resumes at the correct step with refreshed state
    requires:
    - loads
    - setup
  - id: safety
    points: 25
    description: one committed order per journey, bounded retries and no cross-user
      recovery.
    requires:
    - loads
    - behavior
  trials:
  - name: baseline
    profile:
      expire_after: 2
  - name: reordered
    profile:
      expire_after: 2
      html_layout: 1
      reverse_catalog: true
  controls: []
  fixture_aliases: {}
fixtures:
- protocol-jmeter.md
- broken-r13.jmx
scenario: mx-r13-expiry-controller
