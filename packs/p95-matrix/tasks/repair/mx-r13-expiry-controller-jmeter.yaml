  Rubric/gates (per case: earned fraction capped by every prerequisite fraction; average
  all cases, never best case):

  loads: 10 points — plan loads Requires: none.

  setup: 25 points — detects the configured expiry Requires: loads.

  behavior: 40 points — resumes at the correct step with refreshed state Requires:
