id: mx-c09-async-reservation-gatling
category: correlation
tool: gatling
grader: v2_exec
prompt: 'Extract a 202 job ID, poll its dynamic status URL and use the eventual reservation
  ID.

  Write a complete executable solution.

  Execution contract: {"users": 2, "iterations": 2, "mode": "reservation"}. Non-workload
  counts are iterations per user. One committed order per journey, no duplicate/extra
  carts. Two fixture variants count equally; the same artifact is reused without feedback.
  Fresh owner seeds are recorded after execution. Profiles: [{"job_polls": 2, "poll_interval":
  0.02}, {"job_polls": 3, "poll_interval": 0.02, "html_layout": 1, "reverse_catalog":
  true}]. Negative-control overrides: [{"job_fails": true}].

  Rubric/gates (per case: earned fraction capped by every prerequisite fraction; average
  all cases, never best case):

  loads: 10 points — plan loads Requires: none.

  setup: 25 points — job and polling URL correlated Requires: loads.

  behavior: 40 points — ready reservation consumed by the correct checkout Requires:
  loads, setup.

  safety: 25 points — at most 5 polls per job, separated by the profile poll_interval;
  never checks out a pending/failed job. Requires: loads, behavior.

  Malformed/non-executable artifacts earn zero execution-gated credit. A prerequisite
  fault can lose multiple checkpoints.'
params:
  tool: gatling
  contract:
    users: 2
    iterations: 2
    mode: reservation
  rubric:
  - id: loads
    points: 10
    description: plan loads
    requires: []
  - id: setup
    points: 25
    description: job and polling URL correlated
    requires:
    - loads
  - id: behavior
    points: 40
    description: ready reservation consumed by the correct checkout
    requires:
    - loads
    - setup
  - id: safety
    points: 25
    description: at most 5 polls per job, separated by the profile poll_interval;
      never checks out a pending/failed job.
    requires:
    - loads
    - behavior
  trials:
  - name: baseline
    profile:
      job_polls: 2
      poll_interval: 0.02
  - name: reordered
    profile:
      job_polls: 3
      poll_interval: 0.02
      html_layout: 1
      reverse_catalog: true
  controls:
  - job_fails: true
  fixture_aliases: {}
fixtures:
- protocol-gatling.md
scenario: mx-c09-async-reservation
