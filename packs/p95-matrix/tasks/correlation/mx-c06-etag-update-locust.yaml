id: mx-c06-etag-update-locust
category: correlation
tool: locust
grader: v2_exec
prompt: 'Extract an ETag, update a cart with If-Match and recover from one scheduled
  conflict.

  Write a complete executable solution.

  Execution contract: {"users": 2, "iterations": 2, "mode": "etag", "quantity": 2}.
  Non-workload counts are iterations per user. One committed order per journey, no
  duplicate/extra carts. Two fixture variants count equally; the same artifact is
  reused without feedback. Fresh owner seeds are recorded after execution. Profiles:
  [{"require_etag": true, "dynamic_etag": true, "etag_conflict_once": true}, {"require_etag":
  true, "dynamic_etag": true, "etag_conflict_once": true, "html_layout": 1, "reverse_catalog":
  true}]. Negative-control overrides: [].

  Rubric/gates (per case: earned fraction capped by every prerequisite fraction; average
  all cases, never best case):

  loads: 10 points — script loads Requires: none.

  setup: 25 points — initial revision extracted Requires: loads.

  behavior: 40 points — stale update triggers re-read and correct conditional retry
  Requires: loads, setup.

  safety: 25 points — payload preserved and exactly one intended cart mutation commits.
  Requires: loads, behavior.

  Malformed/non-executable artifacts earn zero execution-gated credit. A prerequisite
  fault can lose multiple checkpoints.'
params:
  tool: locust
  contract:
    users: 2
    iterations: 2
    mode: etag
    quantity: 2
  rubric:
  - id: loads
    points: 10
    description: script loads
    requires: []
  - id: setup
    points: 25
    description: initial revision extracted
    requires:
    - loads
  - id: behavior
    points: 40
    description: stale update triggers re-read and correct conditional retry
    requires:
    - loads
    - setup
  - id: safety
    points: 25
    description: payload preserved and exactly one intended cart mutation commits.
    requires:
    - loads
    - behavior
  trials:
  - name: baseline
    profile:
      require_etag: true
      dynamic_etag: true
      etag_conflict_once: true
  - name: reordered
    profile:
      require_etag: true
      dynamic_etag: true
      etag_conflict_once: true
      html_layout: 1
      reverse_catalog: true
  controls: []
  fixture_aliases: {}
fixtures:
- protocol-locust.md
scenario: mx-c06-etag-update
