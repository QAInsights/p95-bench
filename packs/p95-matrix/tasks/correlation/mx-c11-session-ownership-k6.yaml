id: mx-c11-session-ownership-k6
category: correlation
tool: k6
grader: v2_exec
prompt: 'Handle concurrent account sessions where the later login invalidates the
  earlier session, then recover deliberately.

  Write a complete executable solution.

  Execution contract: {"users": 2, "iterations": 1, "mode": "ownership"}. Non-workload
  counts are iterations per user. One committed order per journey, no duplicate/extra
  carts. Two fixture variants count equally; the same artifact is reused without feedback.
  Fresh owner seeds are recorded after execution. Profiles: [{"exclusive_accounts":
  true}, {"exclusive_accounts": true, "html_layout": 1, "reverse_catalog": true}].
  Negative-control overrides: [].

  Both users deliberately share account bench. Synchronize after initial logins, detect
  revocation and recover deliberately; per-virtual-user CSV delay staggers subsequent
  work. Require2 commits without login ping-pong.

  Read-only /fixtures aliases: {"c11-accounts.json": "accounts.json", "c11-account-1.csv":
  "account-1.csv", "c11-account-2.csv": "account-2.csv"}

  Rubric/gates (per case: earned fraction capped by every prerequisite fraction; average
  all cases, never best case):

  loads: 10 points — script loads Requires: none.

  setup: 25 points — detects the specified invalidation Requires: loads.

  behavior: 40 points — renewal and token ownership are correct for both flows Requires:
  loads, setup.

  safety: 25 points — required overlap/completion counts without endless login ping-pong.
  Requires: loads, behavior.

  Malformed/non-executable artifacts earn zero execution-gated credit. A prerequisite
  fault can lose multiple checkpoints.'
params:
  tool: k6
  contract:
    users: 2
    iterations: 1
    mode: ownership
  rubric:
  - id: loads
    points: 10
    description: script loads
    requires: []
  - id: setup
    points: 25
    description: detects the specified invalidation
    requires:
    - loads
  - id: behavior
    points: 40
    description: renewal and token ownership are correct for both flows
    requires:
    - loads
    - setup
  - id: safety
    points: 25
    description: required overlap/completion counts without endless login ping-pong.
    requires:
    - loads
    - behavior
  trials:
  - name: baseline
    profile:
      exclusive_accounts: true
  - name: reordered
    profile:
      exclusive_accounts: true
      html_layout: 1
      reverse_catalog: true
  controls: []
  fixture_aliases:
    c11-accounts.json: accounts.json
    c11-account-1.csv: account-1.csv
    c11-account-2.csv: account-2.csv
fixtures:
- protocol-k6.md
- c11-accounts.json
- c11-account-1.csv
- c11-account-2.csv
scenario: mx-c11-session-ownership
