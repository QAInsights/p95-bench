id: mx-c03-json-parent-child-k6
category: correlation
tool: k6
grader: v2_exec
prompt: 'Select an in-stock product from nested JSON and use its parent-specific variant
  ID.

  Write a complete executable solution.

  Execution contract: {"users": 2, "iterations": 2, "mode": "flow"}. Non-workload
  counts are iterations per user. One committed order per journey, no duplicate/extra
  carts. Two fixture variants count equally; the same artifact is reused without feedback.
  Fresh owner seeds are recorded after execution. Profiles: [{}, {"html_layout": 1,
  "reverse_catalog": true}]. Negative-control overrides: [].

  Rubric/gates (per case: earned fraction capped by every prerequisite fraction; average
  all cases, never best case):

  loads: 10 points — script loads Requires: none.

  setup: 25 points — correct eligible parent selected Requires: loads.

  behavior: 40 points — child variant and cart IDs remain linked through checkout
  Requires: loads, setup.

  safety: 25 points — reordered records and two users do not break selection. Requires:
  loads, behavior.

  Malformed/non-executable artifacts earn zero execution-gated credit. A prerequisite
  fault can lose multiple checkpoints.'
params:
  tool: k6
  contract:
    users: 2
    iterations: 2
    mode: flow
  rubric:
  - id: loads
    points: 10
    description: script loads
    requires: []
  - id: setup
    points: 25
    description: correct eligible parent selected
    requires:
    - loads
  - id: behavior
    points: 40
    description: child variant and cart IDs remain linked through checkout
    requires:
    - loads
    - setup
  - id: safety
    points: 25
    description: reordered records and two users do not break selection.
    requires:
    - loads
    - behavior
  trials:
  - name: baseline
    profile: {}
  - name: reordered
    profile:
      html_layout: 1
      reverse_catalog: true
  controls: []
  fixture_aliases: {}
fixtures:
- protocol-k6.md
scenario: mx-c03-json-parent-child
