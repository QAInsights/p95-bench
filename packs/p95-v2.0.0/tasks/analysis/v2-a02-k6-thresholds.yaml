id: v2-a02-k6-thresholds
category: analysis
tool: k6
grader: v2_analysis
prompt: 'Explain a failing checkout threshold from a tagged k6 summary with a misleading fast aggregate.

  Return only JSON with exactly this structure (leaves are types, not answers):

  {"observations": {"aggregate_p95_ms": "number", "checkout_p95_ms": "number", "limit_ms": "number"},
  "diagnosis": {"route": "string", "failed_metric": "string"}, "evidence": {"keys": ["string", "string"],
  "fix": "string"}}

  Nearest-rank p95=ceil(.95*n), includes failed responses; exclude warmup=true or parent=true. Timestamp
  ms. Numeric absolute tolerance1e-6. Sort row IDs; rank descending p95. Never invent unobserved latencies.

  Sort all evidence ID/key arrays lexicographically. Enum choices: {"fix": ["scope_checkout_threshold",
  "scope_all_routes", "remove_threshold"]}. Other string values must exactly match fixture identifiers.

  Rubric/gates (per case: earned fraction capped by every prerequisite fraction; average all cases, never
  best case):

  loads: 10 points — JSON schema Requires: none.

  setup: 30 points — correct failed threshold and scoped metric values Requires: loads.

  behavior: 40 points — identifies the offending route/scenario rather than the aggregate Requires: loads.

  safety: 20 points — concrete evidence keys and the appropriate scoped threshold fix. Requires: loads.

  Malformed/non-executable artifacts earn zero execution-gated credit. A prerequisite fault can lose multiple
  checkpoints.'
params:
  analysis: thresholds
  rubric:
  - id: loads
    points: 10
    description: JSON schema
    requires: []
  - id: setup
    points: 30
    description: correct failed threshold and scoped metric values
    requires:
    - loads
  - id: behavior
    points: 40
    description: identifies the offending route/scenario rather than the aggregate
    requires:
    - loads
  - id: safety
    points: 20
    description: concrete evidence keys and the appropriate scoped threshold fix.
    requires:
    - loads
  fixture_aliases:
    a02-summary.json: summary.json
fixtures:
- a02-summary.json
