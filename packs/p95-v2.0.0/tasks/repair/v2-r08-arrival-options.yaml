id: v2-r08-arrival-options
category: repair
tool: k6
grader: v2_exec
prompt: 'Repair conflicting `iterations`/`scenarios` options and an under-provisioned arrival executor.

  Repair the supplied artifact.

  Execution contract: {"users": 2, "iterations": 2, "mode": "flow", "workload": true, "rate": 5}. Two fixture
  variants count equally; the same artifact is reused without feedback. Fresh owner seeds are recorded
  after execution. Profiles: [{"delay_seconds": 0.2}, {"delay_seconds": 0.2, "html_layout": 1, "reverse_catalog":
  true}]. Negative-control overrides: [].

  Pool work: POST /v2/work is the operation. No checkout belongs to this pool; orders and
  cart/catalog calls are extra routes unless explicitly needed by another declared pool.
  Count the server request start timestamp, only for authenticated requests with a successful
  owner work event and response status below 400. Login and renewal never count as operations.

  First authenticated eligible POST anchors T0, within10s of launch. Warmup5s, score [T0+5,T0+35) in six5s
  windows, drain<=5s. Phased targets5/15/5 apply to three10s scored plateaus. Count only declared paths/pools;
  login/setup excluded, health/extra routes forbidden. Journey rate counts committed checkout starts,
  not HTTP samplers. Rate fraction=1 within max(10% of expected arrivals, 1 arrival) count error, linear
  to0 at40% relative error; average windows equally, with each window capped by the full scored-window
  mean-rate fraction using the same quantization allowance. Each1s burst<=ceil(1.5*target)+1. Unexpected
  error/dropped work<=1%; max concurrent VUs=32. W06 uses successful completions (scheduled429 is expected,
  never a completion), raw /work ceiling12/s and Retry-After per native worker, including across renewal.
  Same-native-runtime capacity must sustain3x target before grading or this is infrastructure-unavailable.

  Rubric/gates (per case: earned fraction capped by every prerequisite fraction; average all cases, never
  best case):

  loads: 10 points — executable options Requires: none.

  setup: 25 points — preserves the required operation Full window credit allows max(10% of expected arrivals,
  1 arrival) count error; average windows with the same quantized full-window mean-rate cap. Requires:
  loads.

  behavior: 40 points — actual rate stays within the published target bands Requires: loads, setup.

  safety: 25 points — dropped work and errors stay below stated limits without adding extra business requests.
  Requires: loads.

  Malformed/non-executable artifacts earn zero execution-gated credit. A prerequisite fault can lose multiple
  checkpoints.'
params:
  tool: k6
  contract:
    users: 2
    iterations: 2
    mode: flow
    workload: true
    rate: 5
  rubric:
  - id: loads
    points: 10
    description: executable options
    requires: []
  - id: setup
    points: 25
    description: preserves the required operation Full window credit allows max(10% of expected arrivals,
      1 arrival) count error; average windows with the same quantized full-window mean-rate cap.
    requires:
    - loads
  - id: behavior
    points: 40
    description: actual rate stays within the published target bands
    requires:
    - loads
    - setup
  - id: safety
    points: 25
    description: dropped work and errors stay below stated limits without adding extra business requests.
    requires:
    - loads
  trials:
  - name: baseline
    profile:
      delay_seconds: 0.2
  - name: reordered
    profile:
      delay_seconds: 0.2
      html_layout: 1
      reverse_catalog: true
  controls: []
  fixture_aliases: {}
fixtures:
- protocol.md
- broken-r08.js
