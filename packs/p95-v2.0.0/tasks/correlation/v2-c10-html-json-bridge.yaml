id: v2-c10-html-json-bridge
category: correlation
tool: k6
grader: v2_exec
prompt: 'Carry a one-use HTML challenge through JSON APIs with dynamically generated route IDs.

  Write a complete executable solution.

  Execution contract: {"users": 2, "iterations": 2, "mode": "challenge"}. Non-workload counts are iterations
  per user. One committed order per journey, no duplicate/extra carts. Two fixture variants count equally;
  the same artifact is reused without feedback. Fresh owner seeds are recorded after execution. Profiles:
  [{"require_challenge": true}, {"require_challenge": true, "html_layout": 1, "reverse_catalog": true}].
  Negative-control overrides: [].

  Rubric/gates (per case: earned fraction capped by every prerequisite fraction; average all cases, never
  best case):

  loads: 10 points — script loads Requires: none.

  setup: 25 points — challenge extracted from the correct form Requires: loads.

  behavior: 40 points — challenge/resource/cart ownership remains consistent Requires: loads, setup.

  safety: 25 points — one-use semantics, expiry and multiple users all hold. Requires: loads, behavior.

  Malformed/non-executable artifacts earn zero execution-gated credit. A prerequisite fault can lose multiple
  checkpoints.'
params:
  tool: k6
  contract:
    users: 2
    iterations: 2
    mode: challenge
  rubric:
  - id: loads
    points: 10
    description: script loads
    requires: []
  - id: setup
    points: 25
    description: challenge extracted from the correct form
    requires:
    - loads
  - id: behavior
    points: 40
    description: challenge/resource/cart ownership remains consistent
    requires:
    - loads
    - setup
  - id: safety
    points: 25
    description: one-use semantics, expiry and multiple users all hold.
    requires:
    - loads
    - behavior
  trials:
  - name: baseline
    profile:
      require_challenge: true
  - name: reordered
    profile:
      require_challenge: true
      html_layout: 1
      reverse_catalog: true
  controls: []
  fixture_aliases: {}
fixtures:
- protocol.md
