id: v2-c07-rotating-csrf
category: correlation
tool: jmeter
grader: v2_exec
prompt: 'Refresh CSRF from each mutating response instead of reusing the login token.

  Write a complete executable solution.

  Execution contract: {"users": 2, "iterations": 2, "mode": "flow"}. Non-workload counts are iterations
  per user. One committed order per journey, no duplicate/extra carts. Two fixture variants count equally;
  the same artifact is reused without feedback. Fresh owner seeds are recorded after execution. Profiles:
  [{"rotate_csrf": true}, {"rotate_csrf": true, "html_layout": 1, "reverse_catalog": true}]. Negative-control
  overrides: [].

  Rubric/gates (per case: earned fraction capped by every prerequisite fraction; average all cases, never
  best case):

  loads: 10 points — plan loads Requires: none.

  setup: 25 points — login token extracted Requires: loads.

  behavior: 40 points — each mutation uses the latest token Requires: loads, setup.

  safety: 25 points — multiple users/iterations show no stale token use or leaked cart state. Requires:
  loads, behavior.

  Malformed/non-executable artifacts earn zero execution-gated credit. A prerequisite fault can lose multiple
  checkpoints.'
params:
  tool: jmeter
  contract:
    users: 2
    iterations: 2
    mode: flow
  rubric:
  - id: loads
    points: 10
    description: plan loads
    requires: []
  - id: setup
    points: 25
    description: login token extracted
    requires:
    - loads
  - id: behavior
    points: 40
    description: each mutation uses the latest token
    requires:
    - loads
    - setup
  - id: safety
    points: 25
    description: multiple users/iterations show no stale token use or leaked cart state.
    requires:
    - loads
    - behavior
  trials:
  - name: baseline
    profile:
      rotate_csrf: true
  - name: reordered
    profile:
      rotate_csrf: true
      html_layout: 1
      reverse_catalog: true
  controls: []
  fixture_aliases: {}
fixtures:
- protocol.md
