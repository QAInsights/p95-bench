id: v2-m03-redirect-token
category: migration
tool: k6
grader: v2_exec
prompt: 'Preserve a JMX flow that extracts a redirect location and follows a one-use token.

  Translate the supplied JMX to k6.

  Execution contract: {"users": 2, "iterations": 2, "mode": "redirect"}. Non-workload counts are iterations
  per user. One committed order per journey, no duplicate/extra carts. Two fixture variants count equally;
  the same artifact is reused without feedback. Fresh owner seeds are recorded after execution. Profiles:
  [{"login_redirect": true, "require_challenge": true}, {"login_redirect": true, "require_challenge":
  true, "html_layout": 1, "reverse_catalog": true}]. Negative-control overrides: [].

  Rubric/gates (per case: earned fraction capped by every prerequisite fraction; average all cases, never
  best case):

  loads: 10 points — target loads Requires: none.

  setup: 25 points — correct redirect handling Requires: loads.

  behavior: 40 points — dynamic location/token is extracted and consumed in sequence Requires: loads,
  setup.

  safety: 25 points — no extra redirect requests or token reuse across iterations. Requires: loads, behavior.

  Malformed/non-executable artifacts earn zero execution-gated credit. A prerequisite fault can lose multiple
  checkpoints.'
params:
  tool: k6
  contract:
    users: 2
    iterations: 2
    mode: redirect
  rubric:
  - id: loads
    points: 10
    description: target loads
    requires: []
  - id: setup
    points: 25
    description: correct redirect handling
    requires:
    - loads
  - id: behavior
    points: 40
    description: dynamic location/token is extracted and consumed in sequence
    requires:
    - loads
    - setup
  - id: safety
    points: 25
    description: no extra redirect requests or token reuse across iterations.
    requires:
    - loads
    - behavior
  trials:
  - name: baseline
    profile:
      login_redirect: true
      require_challenge: true
  - name: reordered
    profile:
      login_redirect: true
      require_challenge: true
      html_layout: 1
      reverse_catalog: true
  controls: []
  fixture_aliases: {}
fixtures:
- protocol.md
- source-m03.jmx
