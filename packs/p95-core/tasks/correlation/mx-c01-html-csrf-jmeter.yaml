id: mx-c01-html-csrf-jmeter
category: correlation
tool: jmeter
grader: v2_exec
prompt: 'Extract a CSRF value from an HTML login form, then use it through a shop
  flow.

  Write a complete executable solution.

  Execution contract: {"users": 2, "iterations": 2, "mode": "flow"}. Non-workload
  counts are iterations per user. One committed order per journey, no duplicate/extra
  carts. Two fixture variants count equally; the same artifact is reused without feedback.
  Fresh owner seeds are recorded after execution. Profiles: [{"login_csrf": true},
  {"login_csrf": true, "html_layout": 1, "reverse_catalog": true}]. Negative-control
  overrides: [].

  Rubric/gates (per case: earned fraction capped by every prerequisite fraction; average
  all cases, never best case):

  loads: 10 points — plan loads Requires: none.

  setup: 25 points — correct hidden input is selected Requires: loads.

  behavior: 40 points — token/cookie pair authorizes the complete flow Requires: loads,
  setup.

  safety: 25 points — fresh form token works across two independent sessions. Requires:
  loads, behavior.

  Malformed/non-executable artifacts earn zero execution-gated credit. A prerequisite
  fault can lose multiple checkpoints.'
params:
  tool: jmeter
  contract:
    users: 2
    iterations: 2
    mode: flow
  rubric:
  - id: loads
    points: 10
    description: plan loads
    requires: []
  - id: setup
    points: 25
    description: correct hidden input is selected
    requires:
    - loads
  - id: behavior
    points: 40
    description: token/cookie pair authorizes the complete flow
    requires:
    - loads
    - setup
  - id: safety
    points: 25
    description: fresh form token works across two independent sessions.
    requires:
    - loads
    - behavior
  trials:
  - name: baseline
    profile:
      login_csrf: true
  - name: reordered
    profile:
      login_csrf: true
      html_layout: 1
      reverse_catalog: true
  controls: []
  fixture_aliases: {}
fixtures:
- protocol-jmeter.md
scenario: mx-c01-html-csrf
