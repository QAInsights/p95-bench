id: mx-c08-expiry-resume-k6
category: correlation
tool: k6
grader: v2_exec
prompt: 'Recover from session expiry between cart creation and checkout without losing
  the business operation.

  Write a complete executable solution.

  Execution contract: {"users": 2, "iterations": 2, "mode": "expiry"}. Non-workload
  counts are iterations per user. One committed order per journey, no duplicate/extra
  carts. Two fixture variants count equally; the same artifact is reused without feedback.
  Fresh owner seeds are recorded after execution. Profiles: [{"expire_after": 2},
  {"expire_after": 2, "html_layout": 1, "reverse_catalog": true}]. Negative-control
  overrides: [].

  Rubric/gates (per case: earned fraction capped by every prerequisite fraction; average
  all cases, never best case):

  loads: 10 points — script loads Requires: none.

  setup: 25 points — expiry recognized Requires: loads.

  behavior: 40 points — fresh session/CSRF resumes the permitted cart recovery path
  Requires: loads, setup.

  safety: 25 points — exactly one order per user and bounded reauthentication. Requires:
  loads, behavior.

  Malformed/non-executable artifacts earn zero execution-gated credit. A prerequisite
  fault can lose multiple checkpoints.'
params:
  tool: k6
  contract:
    users: 2
    iterations: 2
    mode: expiry
  rubric:
  - id: loads
    points: 10
    description: script loads
    requires: []
  - id: setup
    points: 25
    description: expiry recognized
    requires:
    - loads
  - id: behavior
    points: 40
    description: fresh session/CSRF resumes the permitted cart recovery path
    requires:
    - loads
    - setup
  - id: safety
    points: 25
    description: exactly one order per user and bounded reauthentication.
    requires:
    - loads
    - behavior
  trials:
  - name: baseline
    profile:
      expire_after: 2
  - name: reordered
    profile:
      expire_after: 2
      html_layout: 1
      reverse_catalog: true
  controls: []
  fixture_aliases: {}
fixtures:
- protocol-k6.md
scenario: mx-c08-expiry-resume
