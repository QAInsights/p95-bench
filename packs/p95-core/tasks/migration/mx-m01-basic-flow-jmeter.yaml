id: mx-m01-basic-flow-jmeter
category: migration
tool: jmeter
grader: v2_exec
prompt: 'Convert a k6 cookie/CSRF shop script to JMeter without changing its semantics.


  Translate the supplied k6 script to JMeter.


  Execution contract: {"users": 2, "iterations": 2, "mode": "flow"}. Non-workload
  counts are iterations per user. One committed order per journey, no duplicate/extra
  carts. Two fixture variants count equally; the same artifact is reused without feedback.
  Fresh owner seeds are recorded after execution. Profiles: [{"login_csrf": true},
  {"login_csrf": true, "html_layout": 1, "reverse_catalog": true}]. Negative-control
  overrides: [].

  Rubric/gates (per case: earned fraction capped by every prerequisite fraction; average
  all cases, never best case):

  loads: 10 points — target loads Requires: none.

  setup: 25 points — correct defaults/base URL and request bodies Requires: loads.

  behavior: 40 points — ordered login/catalog/cart/checkout with correlation Requires:
  loads, setup.

  safety: 25 points — source user/iteration counts and success conditions preserved.
  Requires: loads, behavior.

  Malformed/non-executable artifacts earn zero execution-gated credit. A prerequisite
  fault can lose multiple checkpoints.'
params:
  tool: jmeter
  contract:
    users: 2
    iterations: 2
    mode: flow
  rubric:
  - id: loads
    points: 10
    description: target loads
    requires: []
  - id: setup
    points: 25
    description: correct defaults/base URL and request bodies
    requires:
    - loads
  - id: behavior
    points: 40
    description: ordered login/catalog/cart/checkout with correlation
    requires:
    - loads
    - setup
  - id: safety
    points: 25
    description: source user/iteration counts and success conditions preserved.
    requires:
    - loads
    - behavior
  trials:
  - name: baseline
    profile:
      login_csrf: true
  - name: reordered
    profile:
      login_csrf: true
      html_layout: 1
      reverse_catalog: true
  controls: []
  fixture_aliases: {}
fixtures:
- protocol-jmeter.md
- source-m01.js
scenario: mx-m01-basic-flow
