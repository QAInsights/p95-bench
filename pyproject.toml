[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "p95bench"
version = "0.1.0"
description = "Performance test engineering benchmarks for AI models"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]
license = "MIT"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9", "tiktoken>=0.7,<1"]

[project.scripts]
p95bench = "p95bench.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.package-data]
p95bench = ["category-weights.json", "packs.json"]

[tool.ruff]
line-length = 100
